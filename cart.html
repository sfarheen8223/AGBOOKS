<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - AG BOOK CENTRE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>AG BOOK CENTRE</h1>

</header>

<section class="cart-section">

    <h2>Your Shopping Cart</h2>

    <div id="cart-items"></div>

    <h3 id="grand-total">
        Total: ₹0
    </h3>

</section>

<section class="checkout-section">

    <h2>Delivery Details</h2>

    <form id="orderForm">

        <input
            type="text"
            id="customerName"
            placeholder="Full Name"
            required>

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

        <textarea
            id="address"
            placeholder="Delivery Address"
            rows="5"
            required></textarea>

        <label>

            Payment Method

        </label>

        <input
            type="text"
            value="Cash On Delivery"
            readonly>

        <button type="submit">

            Place Order

        </button>

    </form>

</section>

<script src="cart.js"></script>

</body>

</html>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

const container =
document.getElementById("cart-items");

cart.forEach(book => {

    total += book.price;

    container.innerHTML += `
        <div class="cart-item">
            <img src="${book.image}" width="100">

            <h3>${book.title}</h3>

            <p>₹${book.price}</p>
        </div>
    `;
});

document.getElementById("grand-total")
.innerText = "Total: ₹" + total;

</script>

</body>
</html>
