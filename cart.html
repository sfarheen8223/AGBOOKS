<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>AG BOOK CENTRE</h1>
</header>

<section class="cart-section">

    <h2>Your Shopping Cart</h2>

    <div id="cart-items"></div>

    <h3 id="grand-total">Total: ₹0</h3>

</section>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

const container =
document.getElementById("cart-items");

cart.forEach(book => {

    total += book.price;

    container.innerHTML += `
        <div class="cart-item">
            <img src="${book.image}" width="100">

            <h3>${book.title}</h3>

            <p>₹${book.price}</p>
        </div>
    `;
});

document.getElementById("grand-total")
.innerText = "Total: ₹" + total;

</script>

</body>
</html>
